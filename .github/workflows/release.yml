name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      build:
        description: "Sparkle build number; leave empty to use the GitHub run number"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install tools
        run: |
          brew install xcodegen create-dmg

      - name: Audit release identity
        run: ./script/audit_release_identity.sh

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${{ inputs.version }}"
            tag="v${version#v}"
            version="${version#v}"
          fi
          build="${{ inputs.build }}"
          if [[ -z "$build" ]]; then
            build="$GITHUB_RUN_NUMBER"
          fi
          if [[ "$tag" == *"-beta."* || "$tag" == *"-beta"* ]]; then
            channel="beta"
            prerelease="--prerelease"
          else
            channel="stable"
            prerelease=""
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          BRISKEDIT_VERSION: ${{ steps.version.outputs.version }}
          BRISKEDIT_BUILD: ${{ steps.version.outputs.build }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ steps.version.outputs.channel }}
          BRISKEDIT_SPARKLE_PUBLIC_KEY: ${{ secrets.BRISKEDIT_SPARKLE_PUBLIC_KEY }}
          BRISKEDIT_SIGN_IDENTITY: ${{ secrets.BRISKEDIT_SIGN_IDENTITY }}
        run: ./script/package_dmg.sh

      - name: Build Sparkle assets
        env:
          BRISKEDIT_VERSION: ${{ steps.version.outputs.version }}
          BRISKEDIT_BUILD: ${{ steps.version.outputs.build }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ steps.version.outputs.channel }}
          BRISKEDIT_SPARKLE_PRIVATE_KEY: ${{ secrets.BRISKEDIT_SPARKLE_PRIVATE_KEY }}
          BRISKEDIT_SPARKLE_DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}
        run: ./script/create_sparkle_assets.sh

      - name: Verify Sparkle appcast
        run: |
          ./script/verify_appcast.swift \
            "dist/sparkle/appcast.xml" \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/BriskEdit-${{ steps.version.outputs.version }}.zip" \
            "${{ steps.version.outputs.channel }}"

      - name: Verify app signature
        run: codesign --verify --deep --strict dist/BriskEdit.app

      - name: Verify DMG
        env:
          BRISKEDIT_VERSION: ${{ steps.version.outputs.version }}
        run: hdiutil imageinfo "dist/BriskEdit-${BRISKEDIT_VERSION}.dmg" >/dev/null

      - name: Notarize DMG
        env:
          BRISKEDIT_VERSION: ${{ steps.version.outputs.version }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ steps.version.outputs.channel }}
          BRISKEDIT_NOTARY_ENABLED: ${{ secrets.BRISKEDIT_NOTARY_ENABLED }}
          BRISKEDIT_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.BRISKEDIT_NOTARY_KEYCHAIN_PROFILE }}
          BRISKEDIT_NOTARY_APPLE_ID: ${{ secrets.BRISKEDIT_NOTARY_APPLE_ID }}
          BRISKEDIT_NOTARY_TEAM_ID: ${{ secrets.BRISKEDIT_NOTARY_TEAM_ID }}
          BRISKEDIT_NOTARY_PASSWORD: ${{ secrets.BRISKEDIT_NOTARY_PASSWORD }}
        run: ./script/notarize_release.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: BriskEdit-${{ steps.version.outputs.version }}-dmg
          path: dist/BriskEdit-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Upload Sparkle artifact
        uses: actions/upload-artifact@v7
        with:
          name: BriskEdit-${{ steps.version.outputs.version }}-sparkle
          path: |
            dist/sparkle/BriskEdit-${{ steps.version.outputs.version }}.zip
            dist/sparkle/appcast.xml
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          asset="dist/BriskEdit-${RELEASE_VERSION}.dmg"
          sparkle_zip="dist/sparkle/BriskEdit-${RELEASE_VERSION}.zip"
          appcast="dist/sparkle/appcast.xml"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset#BriskEdit-${RELEASE_VERSION}.dmg" --clobber
            gh release upload "$RELEASE_TAG" "$sparkle_zip#BriskEdit-${RELEASE_VERSION}.zip" --clobber
            gh release upload "$RELEASE_TAG" "$appcast#appcast.xml" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$asset#BriskEdit-${RELEASE_VERSION}.dmg" \
              "$sparkle_zip#BriskEdit-${RELEASE_VERSION}.zip" \
              "$appcast#appcast.xml" \
              --target "$GITHUB_SHA" \
              --title "BriskEdit ${RELEASE_VERSION}" \
              --notes-file RELEASE_NOTES.md \
              $RELEASE_PRERELEASE
          fi

      # Refresh the moving beta feed for EVERY release, stable or beta. Beta
      # testers poll this feed; a stable build's appcast rides Sparkle's default
      # channel (no tag), so publishing it here lets beta users roll forward onto
      # the new stable automatically instead of being stranded on an older beta.
      - name: Publish beta appcast feed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beta_tag="beta"
          appcast="dist/sparkle/appcast.xml"
          if gh release view "$beta_tag" >/dev/null 2>&1; then
            gh release edit "$beta_tag" --target "$GITHUB_SHA" --prerelease --title "BriskEdit Beta Feed"
            gh release upload "$beta_tag" "$appcast#appcast.xml" --clobber
          else
            gh release create "$beta_tag" \
              "$appcast#appcast.xml" \
              --target "$GITHUB_SHA" \
              --title "BriskEdit Beta Feed" \
              --notes "Moving Sparkle beta appcast feed. Install beta builds from versioned prereleases." \
              --prerelease
          fi

      # The release is now published with its assets. Trigger a rebuild of the
      # marketing site (johannesgrof.me) so its build-time GitHub fetch picks up
      # the new version and download links. Fires for both stable and beta tags.
      # The release above is created with GITHUB_TOKEN, which by design does not
      # emit a `release` event another workflow could listen on, so we kick the
      # site from here instead of a separate `on: release` workflow.
      - name: Refresh website with new release
        if: success()
        env:
          DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "WEBSITE_DEPLOY_HOOK secret not set — skipping website rebuild." >&2
            exit 0
          fi
          echo "Triggering johannesgrof.me rebuild for ${RELEASE_TAG}…"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")"
          echo "Deploy hook responded with HTTP ${code}"
          case "$code" in
            2*) echo "Website rebuild queued." ;;
            *) echo "Deploy hook failed (HTTP ${code})." >&2; exit 1 ;;
          esac
