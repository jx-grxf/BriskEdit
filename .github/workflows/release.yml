name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing signed tag version without the leading v"
        required: true
        type: string
      build:
        description: "Expected deterministic Sparkle build number (optional safety check)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      channel: ${{ steps.version.outputs.channel }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          version="${tag#v}"
          build="$(./script/release_build_number.sh "$version")"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || {
            echo "error: unsupported release version '$version'" >&2
            exit 1
          }
          [[ "$build" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2}){0,2}$ ]] || {
            echo "error: build number must be a numeric CFBundleVersion" >&2
            exit 1
          }
          if [[ -n "${INPUT_BUILD:-}" && "$INPUT_BUILD" != "$build" ]]; then
            echo "error: supplied build $INPUT_BUILD does not match deterministic build $build for $version" >&2
            exit 1
          fi

          if [[ "$version" == *-beta.* ]]; then
            channel="beta"
          else
            channel="stable"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Verify signed annotated tag on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.object.type' <<<"$ref_json")" == "tag" ]] || {
            echo "error: $RELEASE_TAG must be an annotated tag" >&2
            exit 1
          }
          tag_object="$(jq -r '.object.sha' <<<"$ref_json")"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          [[ "$(jq -r '.verification.verified' <<<"$tag_json")" == "true" ]] || {
            echo "error: GitHub did not verify the signature on $RELEASE_TAG" >&2
            exit 1
          }
          commit="$(jq -r '.object.sha' <<<"$tag_json")"
          git fetch --force origin main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "error: tagged commit is not reachable from origin/main" >&2
            exit 1
          }
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Reject published versions and channel regressions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp | jq 'add' > releases.json
          python3 script/release_policy.py "$RELEASE_VERSION" releases.json

      - name: Verify release metadata
        env:
          BRISKEDIT_VERSION: ${{ steps.version.outputs.version }}
          BRISKEDIT_BUILD: ${{ steps.version.outputs.build }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ steps.version.outputs.channel }}
          BRISKEDIT_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./script/verify_release_metadata.sh

  build-release:
    name: Build and publish release
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 50
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Verify release secrets
        env:
          BRISKEDIT_SPARKLE_PRIVATE_KEY: ${{ secrets.BRISKEDIT_SPARKLE_PRIVATE_KEY }}
          BRISKEDIT_SPARKLE_PUBLIC_KEY: ${{ secrets.BRISKEDIT_SPARKLE_PUBLIC_KEY }}
          BRISKEDIT_SIGN_IDENTITY: ${{ secrets.BRISKEDIT_SIGN_IDENTITY }}
          BRISKEDIT_SIGN_P12_BASE64: ${{ secrets.BRISKEDIT_SIGN_P12_BASE64 }}
          BRISKEDIT_SIGN_P12_PASSWORD: ${{ secrets.BRISKEDIT_SIGN_P12_PASSWORD }}
          BRISKEDIT_NOTARY_ENABLED: ${{ secrets.BRISKEDIT_NOTARY_ENABLED }}
          BRISKEDIT_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.BRISKEDIT_NOTARY_KEYCHAIN_PROFILE }}
          BRISKEDIT_NOTARY_KEY_ID: ${{ secrets.BRISKEDIT_NOTARY_KEY_ID }}
          BRISKEDIT_NOTARY_ISSUER_ID: ${{ secrets.BRISKEDIT_NOTARY_ISSUER_ID }}
          BRISKEDIT_NOTARY_KEY_P8_BASE64: ${{ secrets.BRISKEDIT_NOTARY_KEY_P8_BASE64 }}
          BRISKEDIT_NOTARY_APPLE_ID: ${{ secrets.BRISKEDIT_NOTARY_APPLE_ID }}
          BRISKEDIT_NOTARY_TEAM_ID: ${{ secrets.BRISKEDIT_NOTARY_TEAM_ID }}
          BRISKEDIT_NOTARY_PASSWORD: ${{ secrets.BRISKEDIT_NOTARY_PASSWORD }}
        run: ./script/verify_release_secrets.sh

      - name: Import signing certificate
        env:
          BRISKEDIT_SIGN_P12_BASE64: ${{ secrets.BRISKEDIT_SIGN_P12_BASE64 }}
          BRISKEDIT_SIGN_P12_PASSWORD: ${{ secrets.BRISKEDIT_SIGN_P12_PASSWORD }}
        run: ./script/import_signing_certificate.sh

      - name: Generate locked Xcode project
        run: ./script/prepare_xcode_project.sh

      - name: Test tagged source
        env:
          # Forwarded into the xctest process (xcodebuild only propagates
          # TEST_RUNNER_-prefixed vars); skips UI integration tests that are
          # unstable on the headless CI VM.
          TEST_RUNNER_CI: "1"
        run: |
          set -o pipefail
          mkdir -p .build
          # The app-hosted test runner intermittently crashes in AppKit/WebKit on
          # the headless macOS VM — exit code 65 with zero test failures, after the
          # whole suite has already passed. xcodebuild's own -retry-tests-on-failure
          # only re-runs individual failing tests, not a full-process crash, so we
          # also retry the entire invocation. A genuine failure fails every attempt.
          run_tests() {
            xcodebuild test \
              -project BriskEdit.xcodeproj \
              -scheme BriskEdit \
              -destination 'platform=macOS' \
              -derivedDataPath .build/release-tests \
              -onlyUsePackageVersionsFromResolvedFile \
              -skipPackageUpdates \
              -retry-tests-on-failure \
              -test-iterations 3 \
              BRISKEDIT_WARNINGS_AS_ERRORS=YES \
              | tee .build/release-tests.log | tail -120
          }
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::Test attempt ${attempt}/${attempts}"
            if run_tests; then
              echo "::endgroup::"
              echo "Tests passed on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Test attempt ${attempt}/${attempts} failed (likely the headless-VM crash); retrying."
          done
          echo "::error::Tests failed after ${attempts} attempts."
          exit 1

      - name: Build DMG
        env:
          BRISKEDIT_VERSION: ${{ needs.preflight.outputs.version }}
          BRISKEDIT_BUILD: ${{ needs.preflight.outputs.build }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BRISKEDIT_WARNINGS_AS_ERRORS: "true"
          BRISKEDIT_SPARKLE_PUBLIC_KEY: ${{ secrets.BRISKEDIT_SPARKLE_PUBLIC_KEY }}
          BRISKEDIT_SIGN_IDENTITY: ${{ secrets.BRISKEDIT_SIGN_IDENTITY }}
        run: ./script/package_dmg.sh

      - name: Build Sparkle assets
        env:
          BRISKEDIT_VERSION: ${{ needs.preflight.outputs.version }}
          BRISKEDIT_BUILD: ${{ needs.preflight.outputs.build }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BRISKEDIT_SPARKLE_PRIVATE_KEY: ${{ secrets.BRISKEDIT_SPARKLE_PRIVATE_KEY }}
          BRISKEDIT_SPARKLE_DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}
        run: ./script/create_sparkle_assets.sh

      - name: Notarize DMG
        env:
          BRISKEDIT_VERSION: ${{ needs.preflight.outputs.version }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BRISKEDIT_NOTARY_ENABLED: ${{ secrets.BRISKEDIT_NOTARY_ENABLED }}
          BRISKEDIT_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.BRISKEDIT_NOTARY_KEYCHAIN_PROFILE }}
          BRISKEDIT_NOTARY_KEY_ID: ${{ secrets.BRISKEDIT_NOTARY_KEY_ID }}
          BRISKEDIT_NOTARY_ISSUER_ID: ${{ secrets.BRISKEDIT_NOTARY_ISSUER_ID }}
          BRISKEDIT_NOTARY_KEY_P8_BASE64: ${{ secrets.BRISKEDIT_NOTARY_KEY_P8_BASE64 }}
          BRISKEDIT_NOTARY_APPLE_ID: ${{ secrets.BRISKEDIT_NOTARY_APPLE_ID }}
          BRISKEDIT_NOTARY_TEAM_ID: ${{ secrets.BRISKEDIT_NOTARY_TEAM_ID }}
          BRISKEDIT_NOTARY_PASSWORD: ${{ secrets.BRISKEDIT_NOTARY_PASSWORD }}
        run: ./script/notarize_release.sh

      - name: Verify release artifacts
        env:
          BRISKEDIT_VERSION: ${{ needs.preflight.outputs.version }}
          BRISKEDIT_BUILD: ${{ needs.preflight.outputs.build }}
          BRISKEDIT_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          BRISKEDIT_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BRISKEDIT_NOTARY_ENABLED: ${{ secrets.BRISKEDIT_NOTARY_ENABLED }}
        run: ./script/verify_release_artifacts.sh

      - name: Extract current release notes
        run: |
          ./script/extract_release_notes.sh \
            "${{ needs.preflight.outputs.version }}" \
            dist/RELEASE_NOTES.md

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/BriskEdit-*.dmg
            dist/sparkle/BriskEdit-*.zip
            dist/sparkle/appcast.xml
            dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BriskEdit-${{ needs.preflight.outputs.version }}
          path: |
            dist/BriskEdit-${{ needs.preflight.outputs.version }}.dmg
            dist/sparkle/BriskEdit-${{ needs.preflight.outputs.version }}.zip
            dist/sparkle/appcast.xml
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          assets=(
            "dist/BriskEdit-${RELEASE_VERSION}.dmg#BriskEdit-${RELEASE_VERSION}.dmg"
            "dist/sparkle/BriskEdit-${RELEASE_VERSION}.zip#BriskEdit-${RELEASE_VERSION}.zip"
            "dist/sparkle/appcast.xml#appcast.xml"
            "dist/SHA256SUMS#SHA256SUMS"
          )
          # Assets remain invisible until the complete set has uploaded. The
          # preflight rejects already-published tags; failed drafts may be retried.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            [[ "$(jq -r '.isDraft' release-state.json)" == "true" ]] || {
              echo "error: refusing to replace a published release" >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" \
              --title "BriskEdit ${RELEASE_VERSION}" --notes-file dist/RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false \
              --title "BriskEdit ${RELEASE_VERSION}" --notes-file dist/RELEASE_NOTES.md
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest \
              --title "BriskEdit ${RELEASE_VERSION}" --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json assets,isDraft,url)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]]
          for name in "BriskEdit-${RELEASE_VERSION}.dmg" "BriskEdit-${RELEASE_VERSION}.zip" appcast.xml SHA256SUMS; do
            size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            [[ "$size" =~ ^[1-9][0-9]*$ ]] || {
              echo "error: published asset $name is missing or empty" >&2
              exit 1
            }
          done
          echo "Published $(jq -r '.url' <<<"$release_json")"

      - name: Publish beta appcast feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          fetch_feed() {
            local url="$1" output="$2" code
            code="$(curl --retry 3 --connect-timeout 10 --max-time 45 -sSL -w '%{http_code}' "$url" -o "$output")"
            case "$code" in
              200) ;;
              404) rm -f "$output" ;;
              *) echo "error: feed fetch returned HTTP $code" >&2; exit 1 ;;
            esac
          }
          fetch_feed "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" dist/sparkle/stable-appcast.xml
          fetch_feed "https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/appcast.xml" dist/sparkle/previous-beta-appcast.xml
          ./script/merge_appcasts.py dist/sparkle/appcast.xml dist/sparkle/stable-appcast.xml dist/sparkle/previous-beta-appcast.xml dist/sparkle/beta-appcast.xml
          python3 script/verify_composite_appcast.py dist/sparkle/beta-appcast.xml \
            "${{ needs.preflight.outputs.build }}" "$GITHUB_REPOSITORY" dist/feed-verification > dist/feed-verification.tsv
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' dist/BriskEdit.app/Contents/Info.plist)"
          while IFS=$'\t' read -r index url channel version build; do
            archive="dist/feed-verification/item-${index}.zip"
            curl --fail --retry 3 --connect-timeout 10 --max-time 180 -sSL "$url" -o "$archive"
            ./script/verify_appcast.swift "dist/feed-verification/item-${index}.xml" \
              "$url" "$channel" "$version" "$build" "$archive" "$public_key"
          done < dist/feed-verification.tsv
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta --target "$RELEASE_COMMIT" --prerelease --latest=false --title "BriskEdit Beta Feed"
            gh release upload beta "dist/sparkle/beta-appcast.xml#appcast.xml" --clobber
          else
            gh release create beta "dist/sparkle/beta-appcast.xml#appcast.xml" \
              --target "$RELEASE_COMMIT" \
              --title "BriskEdit Beta Feed" \
              --notes "Moving Sparkle beta appcast feed. Install beta builds from versioned prereleases." \
              --prerelease
          fi

      - name: Remove signing keychain
        if: always()
        run: ./script/cleanup_signing_keychain.sh

      - name: Refresh website with new release
        env:
          DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK:-}" ]]; then
            echo "WEBSITE_DEPLOY_HOOK is not configured; skipping website rebuild."
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")"
          [[ "$code" == 2* ]] || {
            echo "error: website deploy hook returned HTTP $code" >&2
            exit 1
          }
          echo "Website rebuild queued for $RELEASE_TAG."
