name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check whitespace and shell syntax
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA" HEAD
          else
            git diff --check HEAD^
          fi
          bash -n script/*.sh

      - name: Validate release metadata and package lock
        run: ./script/verify_release_metadata.sh

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck script/*.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history
        run: gitleaks git --redact --verbose .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  promo:
    name: Promo tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: promo/package-lock.json

      - name: Install locked dependencies
        working-directory: promo
        run: npm ci

      - name: Audit dependencies
        working-directory: promo
        run: npm audit --audit-level=high

      - name: Lint and type-check
        working-directory: promo
        run: npm run lint

  tests:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate locked Xcode project
        run: ./script/prepare_xcode_project.sh

      - name: Run test suite
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild test \
            -project BriskEdit.xcodeproj \
            -scheme BriskEdit \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci-tests \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            BRISKEDIT_WARNINGS_AS_ERRORS=YES \
            | tee .build/ci-tests.log | tail -120

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: |
            .build/ci-tests.log
            .build/ci-tests/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package smoke test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install packaging tools
        run: brew install xcodegen create-dmg

      - name: Build release DMG
        env:
          BRISKEDIT_BUILD: ${{ github.run_number }}
          BRISKEDIT_UPDATE_CHANNEL: stable
          BRISKEDIT_WARNINGS_AS_ERRORS: "true"
        run: |
          set -euo pipefail
          BRISKEDIT_VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          export BRISKEDIT_VERSION
          ./script/package_dmg.sh
          codesign --verify --deep --strict dist/BriskEdit.app
          hdiutil imageinfo "dist/BriskEdit-${BRISKEDIT_VERSION}.dmg" >/dev/null
          test "$(defaults read "$PWD/dist/BriskEdit.app/Contents/Info" CFBundleShortVersionString)" = "$BRISKEDIT_VERSION"
          test "$(defaults read "$PWD/dist/BriskEdit.app/Contents/Info" CFBundleVersion)" = "$BRISKEDIT_BUILD"

      - name: Upload smoke-test DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BriskEdit-pr-dmg
          path: dist/BriskEdit-*.dmg
          if-no-files-found: error
          retention-days: 7

  build:
    name: build
    # Aggregate gate for branch protection: the `main` ruleset requires a single
    # `build` status check. This job reports green only when every CI job above
    # has passed. `always()` lets it run even when an upstream job fails, and
    # skipped jobs (dependency-review is pull-request only) are tolerated.
    needs: [hygiene, secrets, dependency-review, promo, tests, package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "error: a required CI job reported '$result'" >&2
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs passed."
