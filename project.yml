name: BriskEdit
options:
  bundleIdPrefix: com.johannesgrof
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: YES
    SWIFT_UPCOMING_FEATURE_INFERRED_SENDABLE_CAPTURES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle public key is injected at release time (script/package_dmg.sh
    # passes BRISKEDIT_SPARKLE_PUBLIC_KEY=<key>). Default empty for dev builds.
    BRISKEDIT_SPARKLE_PUBLIC_KEY: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.13.0"

targets:
  BriskEdit:
    type: application
    platform: macOS
    sources:
      - path: Sources/BriskEdit
    dependencies:
      - package: Sparkle
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesgrof.briskedit
        PRODUCT_NAME: BriskEdit
        # Generated Info.plist keys are merged on top of Config/Info.plist,
        # which carries the custom Sparkle keys (SUFeedURL, SUPublicEDKey,
        # SUEnableInstallerLauncherService) that INFOPLIST_KEY_* cannot express.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Johannes Grof"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_CFBundleDisplayName: BriskEdit
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  BriskEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BriskEditTests
    dependencies:
      - target: BriskEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesgrof.briskedit.tests
        GENERATE_INFOPLIST_FILE: YES
