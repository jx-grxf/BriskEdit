name: BriskEdit
options:
  bundleIdPrefix: com.johannesgrof
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: YES
    SWIFT_UPCOMING_FEATURE_INFERRED_SENDABLE_CAPTURES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle EdDSA public key (NOT secret — it ships in every binary). This is
    # the project's canonical release key; the matching private key lives only in
    # GitHub secrets and signs the appcast. Hardcoding the default here means every
    # build path (build_and_run.sh, plain xcodebuild, CI) embeds a valid key, so
    # the updater always starts and can verify downloaded releases. CI still
    # overrides it via BRISKEDIT_SPARKLE_PUBLIC_KEY (same value).
    BRISKEDIT_SPARKLE_PUBLIC_KEY: "17gHGJ4Uk9XDRql8JYoVK+RMPPlB+zPQDSOBNbyvs1k="

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.2"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.13.0"
  Neon:
    url: https://github.com/ChimeHQ/Neon
    revision: 484d6fb9e0c4fb679a1d5f5ddaf2cac2ecf21165
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    # Neon requires this branch. Config/Package.resolved locks it to a reviewed
    # revision, and every build uses -onlyUsePackageVersionsFromResolvedFile.
    branch: main
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    revision: 31d17fe7e818a2048c808b5c6fdc2dc792f4f5b5
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    exactVersion: "0.24.8"

targets:
  BriskEdit:
    type: application
    platform: macOS
    sources:
      - path: Sources/BriskEdit
    dependencies:
      - package: Sparkle
      - package: SwiftTerm
      - package: Neon
      - package: SwiftTreeSitter
      - package: TreeSitterSwift
      - package: TreeSitterJSON
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesgrof.briskedit
        PRODUCT_NAME: BriskEdit
        # Generated Info.plist keys are merged on top of Config/Info.plist,
        # which carries the custom Sparkle keys (SUFeedURL, SUPublicEDKey,
        # SUEnableInstallerLauncherService) that INFOPLIST_KEY_* cannot express.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Johannes Grof"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_CFBundleDisplayName: BriskEdit
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        # Hardened Runtime erzwingt Library Validation (alle Frameworks brauchen
        # dieselbe Team-ID). Bei ad-hoc-Signatur killt das die App, weil Sparkle
        # vorsigniert mit eigener Team-ID kommt. Daher AUS für unsignierte
        # Previews; package_dmg.sh schaltet es bei echtem Developer-ID-Signing
        # (BRISKEDIT_SIGN_IDENTITY) wieder an — was Notarization ohnehin verlangt.
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "$(BRISKEDIT_WARNINGS_AS_ERRORS)"

  BriskEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BriskEditTests
    dependencies:
      - target: BriskEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesgrof.briskedit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "$(BRISKEDIT_WARNINGS_AS_ERRORS)"
